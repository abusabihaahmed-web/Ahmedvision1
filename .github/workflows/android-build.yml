

name: Build AhmadVision APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        run: |
          git clone https://github.com/abusabihaahmed-web/Ahmedvision1.git repo
          unzip -o repo/AhmadVision3-source.zip -d source

      - name: Install Java and Gradle
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk gradle unzip

      - name: Build APK
        run: |
          PROJECT_DIR=$(find source -name settings.gradle -o -name settings.gradle.kts | head -1 | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found"
            exit 1
          fi

          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: AhmadVision-APK
          path: source/**/build/outputs/apk/**/*.apk
          if-no-files-found: error

