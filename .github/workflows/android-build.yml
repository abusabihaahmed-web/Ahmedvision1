
name: Build Ahmed Vision APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unpack project
        run: unzip -o AhmadVision3-source.zip -d source

      - name: Add AndroidX annotation dependency
        run: |
          cat > add-annotation.init.gradle <<'EOF'
          allprojects {
              afterEvaluate { project ->
                  if (project.name == 'app') {
                      project.dependencies.add(
                          'implementation',
                          'androidx.annotation:annotation:1.8.2'
                      )
                  }
              }
          }
          EOF

      - name: Build APK
        run: |
          PROJECT_DIR=$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found"
            exit 1
          fi
          cd "$PROJECT_DIR"
          gradle -I "$GITHUB_WORKSPACE/add-annotation.init.gradle" assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AhmedVision-APK
          path: source/**/build/outputs/apk/**/*.apk
          if-no-files-found: error